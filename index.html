<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 업무 관리</title>
    <link rel="icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="background" id="background"></div>

    <!-- 대기 화면 -->
    <div id="waitScreen" class="wait-screen">
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
    </div>

    <!-- 메인 화면 -->
    <div id="mainScreen" class="main-screen hidden">
        <div class="top-clock">
            <span id="mainDate"></span>
            <span id="mainTime"></span>
        </div>
        <div id="spinnerContainer" class="spinner-container">
            <div class="spinner-wrapper">
                <div class="spinner" id="spinner"></div>
            </div>
        </div>
    </div>

    <!-- 기능 패널 -->
    <div id="featurePanel" class="feature-panel">
        <div id="panelTitle" class="panel-title"></div>
    </div>

    <!-- 유리 오버레이 (드래그 blur 효과) -->
    <div id="glassOverlay" class="glass-overlay"></div>

    <!-- 플로팅 YouTube 플레이어 -->
    <div id="floatingPlayer" class="floating-player hidden"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="scripts/main.js"></script>
</body>

</html>
